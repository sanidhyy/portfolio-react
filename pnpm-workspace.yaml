  - "@sanity/access-ui@6.14.0"
  - "@sanity/diff@6.14.0"
  - "@sanity/mutator@6.14.0"
  - "@sanity/schema@6.14.0"
  - "@sanity/types@6.14.0"
  - "@sanity/util@6.14.0"
  - "@sanity/validation@6.14.0"
  - "@sanity/vision@6.14.0"
  - sanity@6.14.0

overrides:
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
